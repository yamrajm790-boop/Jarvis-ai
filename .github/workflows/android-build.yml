name: Android CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Debug APK Artifact
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/JARVIS-debug.apk
            echo "Successfully copied app-debug.apk to JARVIS-debug.apk"
          else
            echo "ERROR: Debug APK file not found!"
            exit 1
          fi

      - name: Upload JARVIS Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARVIS-Android-APK
          path: build-artifacts/JARVIS-debug.apk
          retention-days: 14
