name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with attached APK'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

jobs:
  release:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          allow-checksums: 'a5e75118d96b4eac2100876f6af6a5ca5029cd440f87736425350fb4cf308b42'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Keystore from Secrets (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Keystore setup complete."
          else
            echo "No KEYSTORE_BASE64 secret provided. Proceeding with default build..."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Signing secrets missing! Building debug APK as fallback for release workflow..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Prepare Release Artifact
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/JARVIS.apk
            echo "Found release APK: JARVIS.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/JARVIS.apk
            echo "Found debug APK fallback: JARVIS.apk"
          else
            echo "ERROR: No generated APK found!"
            exit 1
          fi

      - name: Upload JARVIS Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARVIS-Android-Release-APK
          path: build-artifacts/JARVIS.apk
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        if: ${{ inputs.create_release == true && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JARVIS Android Assistant ${{ inputs.release_tag }}
          body: |
            ## JARVIS Android Assistant - Official Build

            **Version:** ${{ inputs.release_tag }}
            **Build Date:** ${{ github.event.repository.updated_at || 'Latest' }}
            **Commit:** ${{ github.sha }}

            ### What's New
            - Autonomous voice & text device assistant with on-device local execution
            - Comprehensive Permissions Center & Background Assistant Service
            - Render Node.js AI Backend integration
          files: build-artifacts/JARVIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
